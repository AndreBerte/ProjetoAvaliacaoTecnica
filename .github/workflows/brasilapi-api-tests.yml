name: BrasilAPI API Automation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      maxRequests:
        description: 'Limite de requests do CT-007'
        required: false
        default: '10'

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CYPRESS_apiBaseUrl: ${{ vars.BRASILAPI_BASE_URL || 'https://brasilapi.com.br' }}
      CYPRESS_maxRequests: ${{ inputs.maxRequests || vars.BRASILAPI_MAX_REQUESTS || '10' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Cypress REST tests
        uses: cypress-io/github-action@v7
      - name: Generate Allure report
        if: always()
        run: npm run allure:generate
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brasilapi-evidence
          path: evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brasilapi-allure-results
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brasilapi-allure-report
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 14
