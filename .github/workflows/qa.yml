name: QA - Cypress BDD + Allure

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:
    inputs:
      tags:
        description: "Cucumber tag expression"
        required: false
        default: "@regression"

permissions:
  contents: read

jobs:
  cypress:
    name: E2E - Cypress + Cucumber
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      CYPRESS_BASE_URL: https://www.saucedemo.com
      CYPRESS_TAGS: ${{ github.event.inputs.tags || '@regression' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run Cypress
        id: cypress
        continue-on-error: true
        run: npm test

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: videos
          path: cypress/videos
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure report for deployment
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error
          retention-days: 14

      - name: Fail job if Cypress failed
        if: steps.cypress.outcome == 'failure'
        run: exit 1
